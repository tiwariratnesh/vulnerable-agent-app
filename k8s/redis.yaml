apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: agent-test
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agent-test
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
      volumes:
      - name: redis-config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-test
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP


