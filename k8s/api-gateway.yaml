apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: agent-test
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: false
      containers:
      - name: api-gateway
        image: vulnerable-agent/api-gateway:latest
        imagePullPolicy: Never
        securityContext:
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          capabilities:
            add:
              - NET_BIND_SERVICE
              - CHOWN
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "true"
        - name: REDIS_HOST
          value: "redis"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "agent_user"
        - name: POSTGRES_PASSWORD
          value: "insecure_password"
        - name: POSTGRES_DB
          value: "agent_db"
        - name: SECRET_KEY
          value: "super_secret_key_123"
        - name: API_KEY
          value: "sk-api-gateway-key-67890"
        - name: OPENAI_API_KEY
          value: "sk-proj-1234567890abcdef"
        - name: ORCHESTRATOR_URL
          value: "http://agent-orchestrator:8001"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: config-volume
        hostPath:
          path: /etc/agent-config
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agent-test
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
  type: NodePort

